openapi: 3.0.0
info:
  title: Vulnerable API (OWASP Testing)
  description: |
    This API intentionally contains multiple vulnerabilities:
    - Broken Authentication (API2)
    - BOLA (API1)
    - Mass Assignment (API6)
    - SSRF (API10)
    - Excessive Data Exposure (API3)
    - Broken Function Level Authorization (API5)
    - Security Misconfiguration (API7)
    - Sensitive data exposure

  version: 1.0.0

servers:
  - url: http://localhost:4000

tags:
  - name: Authentication
  - name: Users
  - name: Posts
  - name: Admin
  - name: Utility

paths:

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a user (stores plain text passwords)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        200:
          description: Registration success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login (weak JWT secret, no rate limits)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /users:
    get:
      tags: [Users]
      summary: Returns all users (Excessive data exposure)
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of all users (sensitive info included)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      tags: [Users]
      summary: Get a user by ID (BOLA – no owner check)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: User data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      tags: [Users]
      summary: Update user (Mass assignment vulnerability)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        description: Directly applies all fields to the user object
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Updated user record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /posts:
    get:
      tags: [Posts]
      summary: Get all posts
      responses:
        200:
          description: Returns all posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'

  /posts/{id}:
    put:
      tags: [Posts]
      summary: Update post (BOLA + mass assignment)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        description: Arbitrary fields overwrite the post object
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: Updated post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'

  /util/fetch:
    post:
      tags: [Utility]
      summary: SSRF vulnerability (echoes remote URL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetUrl:
                  type: string
      responses:
        200:
          description: Echoed SSRF request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  target:
                    type: string

  /admin/stats:
    get:
      tags: [Admin]
      summary: Admin endpoint with no proper role checking
      security:
        - bearerAuth: []
      responses:
        200:
          description: Server stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: integer
                  posts:
                    type: integer

  /openapi.json:
    get:
      tags: [Utility]
      summary: Exposes OpenAPI publicly (Improper Assets Management)
      responses:
        200:
          description: Returns this OpenAPI file

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string

    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        userId:
          type: integer

    User:
      type: object
      description: User object with sensitive fields exposed
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
        balance:
          type: number
        is_admin:
          type: boolean

    Post:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        content:
          type: string
        author:
          type: string
        is_featured:
          type: boolean
