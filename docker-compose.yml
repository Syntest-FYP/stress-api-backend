version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: pg
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: stressapisllgv
      POSTGRES_PASSWORD: sllgv20hoptportgresheu
      POSTGRES_DB: stressdb
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=stressdb
      - DB_POSTGRESDB_USER=stressapisllgv
      - DB_POSTGRESDB_PASSWORD=sllgv20hoptportgresheu
    depends_on:
      - postgres

volumes:
  pgdata:
