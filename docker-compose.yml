services:
  postgres:
    image: postgres:15
    container_name: pg
    restart: always
    ports:
      - "5433:5432"  # Changed to 5433 to avoid conflict with Windows PostgreSQL service
    environment:
      POSTGRES_USER: stressapisllgv
      POSTGRES_PASSWORD: sllgv20hoptportgresheu
      POSTGRES_DB: stressdb
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6380:6379"  # Changed to 6380 to avoid conflict with local Redis service on 6379
    command: redis-server --requirepass sllgVD@

  k6:
    image: grafana/k6:latest
    container_name: k6_runner
    volumes:
      - k6_scripts:/scripts
      - k6_results:/results
    entrypoint: ["tail", "-f", "/dev/null"]

  # n8n:
